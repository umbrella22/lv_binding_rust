[alias]
test-lvgl = "test -- --test-threads=1"

# Cross-compile support brought in from PR #206 (mLupine LVGL 9.2 port).
[target.xtensa-esp32s3-espidf]
linker    = "ldproxy"
runner    = "espflash flash --monitor"
rustflags = ["--cfg", "espidf_time64"]

[unstable]
# Only takes effect together with an explicit --target (e.g. the xtensa
# section above); plain host `cargo build/test` ignores it. Cargo has no
# per-target syntax for build-std, so it lives globally in this file.
build-std = ["std", "panic_abort"]

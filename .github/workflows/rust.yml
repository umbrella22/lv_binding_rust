name: Rust

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
      - name: Update APT
        run: sudo apt-get update

      - name: Install SDL2
        run: sudo apt install libsdl2-dev libsdl2-2.0-0

      - uses: actions/checkout@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose -- --test-threads 1

      - name: Check examples
        run: cargo check -p lvgl --examples --features alloc

      - name: Check SDL simulator
        run: cargo check -p lvgl --features sdl --examples
